<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeStride Heist Route Preview</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: url('../static/images/img.png');
      color: #e74c3c;
      padding: 20px;
      margin: 0;
      
    }
    .container {
      max-width: 651px;
      margin: auto;
      background: #000000db;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(231, 76, 60, 0.7);
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    h1, h2 {
      text-align: center;
      color: #ff4d4d;
    }
    h1{
      text-decoration: underline;
      text-decoration-style: wavy;
    }
    .output {
      margin-top: 2rem;
      text-align: center;
    }
    .output img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 1rem;
      border: 2px solid #c0392b;
    }
    .back-button {
      display: block;
      margin: 2rem auto 0;
      padding: 12px 24px;
      background-color: #e50914;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      width: fit-content;
    }
    .back-button:hover {
      background-color: #ff0000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hacktivate 5.0 - SafeStride</h1>
    <h1>PHINISHERS</h1>
    <h2>Route Preview</h2>
    <div class="output">
      <p>ROUTE IMAGE:</p>
      <img src="{{output_img}}" alt="Generated Route">
    </div>
    <a href="/" class="back-button">🔙 Plan Another Route</a>
  </div>
</body>
</html>
